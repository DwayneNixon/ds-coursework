
syntax = "proto3";

service ParameterServer {
    rpc Push (PushRequest) returns (PushResponse);
    rpc Pull (PullRequest) returns (PullResponse);

    rpc SetUpdateRule (SetUpdateRuleRequest)
        returns (SetUpdateRuleResponse);

    rpc RegisterUpdateRule (RegisterUpdateRuleRequest)
    returns (RegisterUpdateRuleResponse);
}

message PushRequest {
    repeated uint64 keys = 1;
    repeated double gradients = 2;
    uint32 width = 3;
    KeyRange key_range = 4;
    TaskId task_id = 5;
    repeated ClockEntry required_clock = 8;

    // Tasks that must succeed before this push executes.
    repeated TaskId dependencies = 6;

    // Logical training iteration, independent of Task ID sequence.
    optional uint64 iteration = 7;

    // D1: Identify a reusable sparse key list.
    bytes key_cache_id = 9;

    // D1: Resolve keys from the server cache instead of request.keys.
    bool use_cached_keys = 10;

    bytes compressed_gradients = 11;
    bool gradients_compressed = 12;
}

message PushResponse {
    bool accepted = 1;
    repeated ClockSegment clocks = 2;
}

message PullRequest {
    repeated uint64 keys = 1;
    KeyRange key_range = 2;
    repeated ClockEntry required_clock = 5;

    // Identity of this pull operation.
    TaskId task_id = 3;

    // Tasks that must succeed before this pull executes.
    repeated TaskId dependencies = 4;

    // D1: Identify a reusable sparse key list.
    bytes key_cache_id = 6;

    // D1: Resolve keys from the server cache instead of request.keys.
    bool use_cached_keys = 7;

    bool accept_compressed_values = 8;
}

message PullResponse {
    repeated double values = 1;
    repeated uint64 keys = 2;
    uint32 width = 3;
    repeated ClockSegment clocks = 4;
    bytes compressed_values = 5;
    bool values_compressed = 6;
}

message KeyRange {
    uint64 begin = 1;
    uint64 end = 2;
}

message TaskId {
    uint32 worker_id = 1;
    uint64 sequence = 2;
}


message ClockEntry {
    uint32 worker_id = 1;
    uint64 counter = 2;
}

message ClockSegment {
    string partition_id = 1;
    uint64 begin = 2;
    uint64 end = 3;

    // An exclusive endpoint of 2^64 cannot fit in uint64.
    bool end_is_keyspace_end = 4;

    repeated ClockEntry entries = 5;
}


message SetUpdateRuleRequest {
    string name = 1;
}

message SetUpdateRuleResponse {
    string active_rule = 1;
}

message RegisterUpdateRuleRequest {
    string name = 1;
    double gradient_scale = 2;
}

message RegisterUpdateRuleResponse {
    bool registered = 1;
}
