name: Audit regression smoke tests

on:
  push:
    branches:
      - audit/fix-runner-paths
  workflow_dispatch:

# Needed only to archive verified generated evidence on the audit branch.
permissions:
  contents: write

# Keep only the newest audit run when consecutive fixes are pushed.
concurrency:
  group: audit-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile and inspect imports
        run: |
          python -m compileall -q -x '/__pycache__/' .
          python -m scripts.check_repository
          python -c "import server, parameter_client, server_manager, experiments.b4_scenarios, experiments.x6_failover, experiments.x7_failures"
      - name: Part A standalone regressions
        run: |
          python -m tests.part_a.test_server_dependencies
          python -m tests.part_a.test_request_limits
          python -m tests.part_a.test_rule_registration
          python -m tests.part_a.test_concurrent_pushes
      - name: Part B native dense-range worker integration
        run: |
          python -m tests.part_b.test_b2_worker_dense_range
          python -m tests.part_b.test_b2_million_key_distributed
      - name: X1 analytical multiworker oracle
        run: |
          python -m experiments x1
      - name: X2 fixed-workload 1–8-server scaling
        run: |
          python -m experiments x2 --output results/x2_scaling
      - name: Part C worker integration
        run: |
          python -m tests.part_c.test_c1_worker_harness
      - name: X3 consistency evaluation
        run: |
          python -m experiments x3
      - name: Part B integrated harness smoke
        run: |
          python -u server.py > /tmp/ds-audit-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/ds-audit-server.log' EXIT
          sleep 2
          python -m experiments b4
      - name: D3 batching and X4 communication analysis
        run: |
          python -m experiments d3 --output results/d3_benchmark/comparison.csv
          python -m experiments x4
      - name: E1 selective freeze and F3 process recovery regressions
        run: |
          python -m tests.part_e.test_e12_source_transfer
          python -m unittest -v tests.part_f.test_f31_replica_promotion
          python -m unittest -v tests.part_f.test_f32_replication_repair
      - name: Part F process-based smoke
        run: |
          python -m unittest -v tests.part_f.test_f12_automatic_failure_detection
          python -m unittest -v tests.part_f.test_f24_process_replication
      - name: X6 live fault experiment
        run: |
          python -m experiments x6 --output results/x6_failover
      - name: X7 fault matrix
        run: |
          python -m experiments x7 --x6-summary results/x6_failover/summary.json --output results/x7_fault_matrix
      - name: Build and verify eight-page report PDF
        run: |
          python -m pip install -r requirements-report.txt
          python -m scripts.build_report_pdf
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          pdf = PdfReader("submission/parameter_server_report.pdf")
          txt = "\\n".join(page.extract_text() or "" for page in pdf.pages)
          assert 1 <= len(pdf.pages) <= 8, len(pdf.pages)
          for term in (
              "X7: Failure matrix", "Primary crash mid-iteration",
              "Safe refusal (fail-closed)", "Evidence revision",
              "Median", "Pushes/s",
          ):
              assert term in txt, f"Missing report evidence: {term}"
          for old in ("informal report draft", "Before submission:",
                      "replace figure references", "{{X2_TABLE}}"):
              assert old not in txt, f"Draft marker leaked into PDF: {old}"
          print(f"PDF content and pagination: PASS ({len(pdf.pages)} pages)")
          PY
      - name: Validate and fingerprint evidence
        run: |
          python -m scripts.archive_audit_evidence
      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-smoke-evidence
          path: |
            /tmp/ds-audit-server.log
            results/x1_aggregation/
            results/x2_scaling/
            results/c5_evaluation/
            results/d3_benchmark/
            results/x4_comparison/
            submission/parameter_server_report.pdf
            submission/parameter_server_report.md
            results/ci_evidence_manifest.json
            docs/REPORT_DRAFT.md
            docs/ARCHITECTURE.md
            results/x6_failover/
            results/x7_fault_matrix/
          if-no-files-found: ignore
      - name: Commit validated evidence to audit branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/audit/fix-runner-paths'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/x1_aggregation/ results/x2_scaling/ results/c5_evaluation/
          git add -f results/d3_benchmark/ results/x4_comparison/
          git add -f results/x6_failover/ results/x7_fault_matrix/
          git add -f results/ci_evidence_manifest.json
          git add -f submission/parameter_server_report.pdf submission/parameter_server_report.md
          if git diff --cached --quiet; then
            echo "Validated experiment evidence already committed"
            exit 0
          fi
          git commit -m "Archive verified X1-X7 results and report [skip ci]"
          git push origin HEAD:refs/heads/audit/fix-runner-paths
